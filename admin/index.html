<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content manager — Gabriele Stoia</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
<script>
(function () {
  if (!window.CMS || !window.React) return;
  var e = React.createElement;

  var BX = { fontFamily: "-apple-system,'Segoe UI',Roboto,Helvetica,sans-serif",
             padding: '28px', lineHeight: 1.55, color: '#1c1b19', maxWidth: '640px' };
  var MUT = { color: '#888', fontSize: '13px' };

  function g(d, k) { return d && d.get ? (d.get(k) || '') : ''; }
  function toArr(v) {
    if (!v) return [];
    if (Array.isArray(v)) return v;
    if (v.toJS) { try { return v.toJS() || []; } catch (err) { return []; } }
    return [];
  }

  CMS.registerPreviewTemplate('stories', function (props) {
    var d = props.entry.getIn(['data']);
    var items = toArr(d && d.get ? d.get('items') : []);
    var nPhotos = items.filter(function (it) { return it.type !== 'slide'; }).length;
    var nSlides = items.length - nPhotos;
    return e('div', { style: BX },
      e('div', { style: { fontSize: '22px', fontWeight: 700 } },
        String(g(d, 'title_en') || g(d, 'title_it') || '(no title)')),
      e('div', { style: MUT },
        [g(d, 'location'), g(d, 'year')].filter(Boolean).join(' \u00b7 ')),
      (g(d, 'description_en') || g(d, 'description_it')) ?
        e('p', { style: { fontStyle: 'italic', color: '#555', margin: '12px 0 0' } },
          String(g(d, 'description_en') || g(d, 'description_it')).slice(0, 240)) : null,
      e('p', { style: MUT },
        nPhotos + ' photo' + (nPhotos === 1 ? '' : 's') +
        (nSlides ? ' \u00b7 ' + nSlides + ' text slide' + (nSlides === 1 ? '' : 's') : '')),
      e('p', { style: { color: '#bbb', fontSize: '12px', marginTop: '18px' } },
        'Images are not previewed here \u2014 check the live site.'));
  });

  CMS.registerPreviewTemplate('publications', function (props) {
    var d = props.entry.getIn(['data']);
    var meta = [g(d, 'magazine'), g(d, 'date'), g(d, 'country')].filter(Boolean).join(' \u00b7 ');
    return e('div', { style: BX },
      e('div', { style: { fontSize: '22px', fontWeight: 700 } }, String(g(d, 'magazine') || '(magazine)')),
      e('div', { style: { fontSize: '15px', margin: '4px 0' } }, String(g(d, 'article_title'))),
      e('div', { style: MUT }, meta),
      g(d, 'file') ? e('p', { style: MUT },
        (/\.pdf$/i.test(String(g(d, 'file'))) ? 'PDF attached: ' : 'Image attached: ') + String(g(d, 'file'))) : null);
  });

  CMS.registerPreviewTemplate('settings', function (props) {
    var d = props.entry.getIn(['data']);
    var socials = toArr(d && d.get ? d.get('socials') : []);
    return e('div', { style: BX },
      e('div', { style: { fontSize: '20px', fontWeight: 700 } }, String(g(d, 'name'))),
      e('div', { style: MUT }, String(g(d, 'email'))),
      e('p', { style: { marginTop: '12px' } }, String(g(d, 'bio_en')).slice(0, 300)),
      e('p', { style: MUT }, String(g(d, 'footer'))),
      e('p', { style: MUT },
        socials.map(function (s) { return String(s.name); }).join(' \u00b7 ') || 'no socials'));
  });
})();
</script>
</body>
</html>
