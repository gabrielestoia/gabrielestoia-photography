backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "img/uploads"

collections:
  - name: "settings"
    label: "1. Settings"
    files:
      - name: "general"
        label: "General settings"
        file: "content/settings.json"
        fields:
          - { label: "Your name", name: "name", widget: "string" }
          - { label: "Contact email", name: "email", widget: "string" }
          - { label: "Bio (English)", name: "bio_en", widget: "text" }
          - { label: "Bio (Italiano)", name: "bio_it", widget: "text" }
          - { label: "Footer text", name: "footer", widget: "string",
             hint: "e.g. All content \u00a9 Gabriele Stoia. All rights reserved." }
          - label: "Social links (shown in the footer, above the copyright)"
            name: "socials"
            widget: "list"
            fields:
              - { label: "Label", name: "name", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }

  - name: "stories"
    label: "2. Stories"
    folder: "content/stories"
    create: true
    format: json
    extension: json
    slug: "{{slug}}"
    summary: "{{title_en}} — {{location}} {{year}}"
    sortable_fields: [order, title_en, year]
    fields:
      - { label: "Order (sidebar position: 1, 2, 3 ...)", name: "order", widget: "number", default: 10 }
      - { label: "Story title (English)", name: "title_en", widget: "string" }
      - { label: "Titolo (Italiano)", name: "title_it", widget: "string" }
      - { label: "Slug (address: lowercase, no spaces)", name: "slug", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Year", name: "year", widget: "string" }
      - { label: "Group (sidebar section, optional)", name: "group", widget: "string", required: false }
      - { label: "Description (English)", name: "description_en", widget: "text", required: false,
         hint: "Shown as the opening text slide of the story" }
      - { label: "Descrizione (Italiano)", name: "description_it", widget: "text", required: false,
         hint: "Mostrata come slide di apertura della storia" }
      - { label: "Cover image (optional - defaults to the first photo)",
          name: "cover", widget: "image", required: false }
      - label: "Photos and text slides (photo count is calculated automatically)"
        name: "items"
        widget: "list"
        collapsed: true
        summary: "{{fields.image}}{{fields.text_en}}"
        typeKey: "type"
        types:
          - label: "Photo"
            name: "photo"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Caption (English)", name: "caption_en", widget: "string", required: false }
              - { label: "Didascalia (Italiano)", name: "caption_it", widget: "string", required: false }
          - label: "Text slide"
            name: "slide"
            widget: "object"
            fields:
              - { label: "Text (English)", name: "text_en", widget: "text", required: false }
              - { label: "Testo (Italiano)", name: "text_it", widget: "text", required: false }

  - name: "publications"
    label: "3. Publications"
    folder: "content/publications"
    create: true
    format: json
    extension: json
    slug: "{{slug}}"
    summary: "{{magazine}} — {{article_title}} ({{date}})"
    sortable_fields: [order, date, magazine]
    fields:
      - { label: "Order (list position: 1, 2, 3 ...)", name: "order", widget: "number", default: 10 }
      - { label: "Related story title", name: "story_title", widget: "string", required: false }
      - { label: "Magazine", name: "magazine", widget: "string" }
      - { label: "Article title", name: "article_title", widget: "string" }
      - { label: "Publication date", name: "date", widget: "string" }
      - { label: "Country", name: "country", widget: "string", required: false }
      - { label: "File (image or PDF)", name: "file", widget: "file", required: false }
